# QuizMind server configuration. Copy to config.yaml and pass with -config.
# Secrets (API keys, the bearer token) come from environment variables, never from this file.

listen: 127.0.0.1:8080        # use 0.0.0.0:8080 only on a trusted home LAN, and set QUIZMIND_TOKEN
data_dir: ~/Library/Application Support/QuizMind

auth:
  token_env: QUIZMIND_TOKEN   # guards /admin only (quiz API is open); required unless listen is loopback

pipeline:
  questions_per_chunk: 3
  chunk_min_chars: 300
  chunk_max_chars: 1500
  worker_concurrency: 2
  max_upload_bytes: 2097152
  dedupe_threshold: 0.8

llm:
  providers:
    anthropic_main:
      type: anthropic
      api_key_env: ANTHROPIC_API_KEY
      # base_url: https://your-proxy.example.com   # optional
  roles:
    generator:
      provider: anthropic_main
      model: claude-sonnet-5-5
      effort: medium            # low | medium | high | xhigh | max
      max_tokens: 16000
    # validator: (M3) independent answering check, e.g. a cheaper model
  limits:
    max_concurrency: 2          # in-flight LLM requests
    rps: 2
    daily_token_budget: 2000000 # generation pauses (jobs deferred) once spent; 0 = unlimited
