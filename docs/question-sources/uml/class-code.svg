<svg xmlns="http://www.w3.org/2000/svg" width="740" height="230" viewBox="0 0 740 230" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title>由描述画出类间关系</title>
  <rect width="740" height="230" fill="#ffffff"/>
  <rect x="30" y="30" width="110" height="46" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="85" y="58.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">汽车</text>
  <rect x="260" y="30" width="110" height="46" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="315" y="58.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">发动机</text>
  <rect x="30" y="140" width="110" height="46" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="85" y="168.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">司机</text>
  <rect x="260" y="140" width="110" height="46" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="315" y="168.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">地图</text>
  <polygon points="140.0,53.0 151.0,46.0 162.0,53.0 151.0,60.0" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <polyline points="162.0,53.0 260.0,53.0" fill="none" stroke="#374151" stroke-width="1.5"/>
  <polyline points="248.0,169.0 260.0,163.0 248.0,157.0" fill="none" stroke="#374151" stroke-width="1.5"/>
  <polyline points="140.0,163.0 260.0,163.0" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="48" font-size="13" text-anchor="start" fill="#1f2937">汽车创建时一并创建发动机，</text>
  <text x="400" y="68" font-size="13" text-anchor="start" fill="#1f2937">汽车销毁时发动机随之销毁</text>
  <text x="400" y="158" font-size="13" text-anchor="start" fill="#1f2937">司机的方法只在参数里临时用到地图，</text>
  <text x="400" y="178" font-size="13" text-anchor="start" fill="#1f2937">并不保存地图的引用</text>
</svg>
