<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title>类的表示与可见性</title>
  <rect width="680" height="270" fill="#ffffff"/>
  <rect x="20" y="20" width="200" height="166" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="40.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">学生</text>
  <line x1="20.0" y1="50.0" x2="220.0" y2="50.0" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="68" font-size="13" text-anchor="start" fill="#1f2937">- id: int</text>
  <text x="28" y="88" font-size="13" text-anchor="start" fill="#1f2937">+ name: String</text>
  <text x="28" y="108" font-size="13" text-anchor="start" fill="#1f2937"># score: float</text>
  <text x="28" y="128" font-size="13" text-anchor="start" fill="#1f2937">~ level: int</text>
  <line x1="20.0" y1="138.0" x2="220.0" y2="138.0" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="156" font-size="13" text-anchor="start" fill="#1f2937">+ study(): void</text>
  <text x="28" y="176" font-size="13" text-anchor="start" fill="#1f2937">- calc(): int</text>
  <rect x="250" y="20" width="190" height="106" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="345" y="40.4" font-size="15" text-anchor="middle" fill="#1f2937" font-style="italic">Shape</text>
  <line x1="250.0" y1="50.0" x2="440.0" y2="50.0" stroke="#374151" stroke-width="1.5"/>
  <text x="258" y="68" font-size="13" text-anchor="start" fill="#1f2937"># color: String</text>
  <line x1="250.0" y1="78.0" x2="440.0" y2="78.0" stroke="#374151" stroke-width="1.5"/>
  <text x="258" y="96" font-size="13" text-anchor="start" fill="#1f2937" font-style="italic">+ draw()</text>
  <text x="258" y="116" font-size="13" text-anchor="start" fill="#1f2937" font-style="italic">+ area(): double</text>
  <rect x="470" y="20" width="190" height="94" rx="0" fill="#fffdf0" stroke="#374151" stroke-width="1.5"/>
  <text x="565" y="38.32" font-size="12" text-anchor="middle" fill="#6b7280">«interface»</text>
  <text x="565" y="55.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Drawable</text>
  <line x1="470.0" y1="66.0" x2="660.0" y2="66.0" stroke="#374151" stroke-width="1.5"/>
  <text x="478" y="84" font-size="13" text-anchor="start" fill="#1f2937">+ draw(): void</text>
  <text x="478" y="104" font-size="13" text-anchor="start" fill="#1f2937">+ resize(k: int)</text>
  <text x="120" y="222" font-size="13" text-anchor="middle" fill="#6b7280">普通类</text>
  <text x="345" y="222" font-size="13" text-anchor="middle" fill="#6b7280">抽象类：类名用斜体</text>
  <text x="565" y="222" font-size="13" text-anchor="middle" fill="#6b7280">接口：«interface»</text>
  <text x="340" y="252" font-size="13" text-anchor="middle" fill="#1f2937">可见性：+ 公有    - 私有    # 受保护    ~ 包内可见</text>
</svg>
