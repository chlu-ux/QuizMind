openapi: 3.0.3
info:
  title: QuizMind app API
  version: 0.1.0
  description: |
    Endpoints used by the Flutter app and the H5 app. The admin API (/admin/*) is consumed only by the
    bundled Vue UI and is not part of this contract.
    These endpoints need no authentication, except `/ai/*` and `/agent/*`, which need the access token
    set in the admin UI (`Authorization: Bearer <token>`); the admin API (/admin/*) is guarded by the server token.
    Timestamps are Unix milliseconds. Errors are `{"error": "message"}`.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: ok }
  /api/v1/banks:
    get:
      summary: Banks with their published question count
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bank" }
  /api/v1/media/{id}:
    get:
      summary: A picture used by questions
      description: |
        `stem`, `options` and `explanation` are Markdown. A picture is written `![alt](media:<id>)`;
        a client turns that into `{base}/api/v1/media/<id>`. The id is a prefix of the content's
        SHA-256, so the response never changes (`Cache-Control: immutable`) and can be cached forever.
        Pictures are PNG, JPEG, GIF or WebP; uploads go through the admin API (`POST /admin/media`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{24}$" } }
      responses:
        "200":
          description: the image bytes
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "404": { description: unknown picture }
  /api/v1/lessons:
    get:
      summary: The study text of every bank
      description: |
        Every readable section of every document (a chapter of a bank), in reading order. A
        question's `chunk_id` is the `id` of the section it was generated from, so the app can offer
        "read the section, then practise its questions". The library is small and changes rarely, so
        it is fetched whole: pass the `version` the app already holds and, if it is still current, the
        answer has `unchanged: true` and no items.
      parameters:
        - { name: version, in: query, schema: { type: integer, default: 0 }, description: "the version the caller has; 0 = none" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonsPage" }
  /api/v1/sync/questions:
    get:
      summary: Incremental question download
      description: |
        Returns changes with sync_seq > since in sync_seq order. Published questions come back in
        `items`; questions that are no longer published come back in `deleted`. Repeat with
        `since = next_seq` while `has_more` is true.
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionsPage" }
  /api/v1/sync/states:
    get:
      summary: Incremental download of per-question learning state
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "server sync_seq cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatesPage" }
    post:
      summary: Upload states (last writer wins on updated_at)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items: { $ref: "#/components/schemas/State" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
  /api/v1/sync/sessions:
    get:
      summary: Incremental download of saved quizzes ("continue where you left off")
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "server sync_seq cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 100 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsPage" }
    post:
      summary: Upload saved quizzes (last writer wins on updated_at)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/SessionProgress" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { description: invalid session }
  /api/v1/sync/attempts:
    get:
      summary: Incremental download of the answer log (so every device sees the whole history)
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "server sync_seq cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptsPage" }
    post:
      summary: Append answer records (idempotent on id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items: { $ref: "#/components/schemas/Attempt" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { description: invalid attempt }
  /api/v1/sync/exams:
    get:
      summary: Incremental download of finished mock exams
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "server sync_seq cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 100 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamsPage" }
    post:
      summary: Upload finished exams (append-only, idempotent on id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items: { $ref: "#/components/schemas/Exam" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { description: invalid exam }
  /api/v1/sync/notes:
    get:
      summary: Incremental download of AI explanations (one per question)
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "server sync_seq cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 100 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesPage" }
    post:
      summary: Upload AI explanations (last writer wins on updated_at; unknown questions are ignored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/AiNote" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { description: invalid note }
  /api/v1/ai/config:
    get:
      summary: The OpenAI-compatible endpoint the app calls for AI explanations (includes the API key)
      description: >
        Configured in the admin UI. Unlike the rest of /api/v1 this needs the access token
        set there: `Authorization: Bearer <token>`. 404 means the feature is switched off,
        and the app should drop its copy of the configuration.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConfig" }
        "401": { description: missing or wrong access token }
        "404": { description: AI explanations are not enabled }
  /api/v1/ai/usage:
    post:
      summary: Report the token use of AI explanations the app requested from the model itself
      description: >
        The app calls the explanation model directly, so the server cannot see what that costs; the app
        reports each call here (queued on the device and sent on sync). Needs the same access token as
        `/ai/config`, which keeps working after the feature is switched off so a queued report is not
        lost. The app chooses the `id` (a ULID): a report sent twice counts once (`ignored`). These
        calls show up in the admin usage page, but do not count against the server's daily token
        budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/AiUsage" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { description: invalid record }
        "401": { description: missing or wrong access token }
  /api/v1/questions/{id}/flag:
    post:
      summary: Report that a question has a problem; two unresolved reports take it offline
      description: |
        The body is optional. Clients that send none (or an unknown reason) are recorded as `other`.
        A reviewer settling the reports (approve, reject, or "dismiss flags" in the admin UI) resets
        the count, so `flag_count` is the number of unresolved reports.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [wrong_answer, ambiguous, typo, other]
                  description: wrong answer / ambiguous stem / typo in options or text / other
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag_count: { type: integer }
                  status: { type: string }
        "404": { description: unknown question }
  /api/v1/agent/status:
    get:
      summary: Whether the study assistant can be used
      description: >
        Needs the access token set in the admin UI (the same one as `/ai/config`):
        `Authorization: Bearer <token>`. 404 means no model is bound to the assistant role (or the
        server predates the assistant); the app should hide or disable its entry points.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
        "401": { description: missing or wrong access token }
        "404": { description: the assistant is not configured }
  /api/v1/agent/chat:
    post:
      summary: Ask the study assistant; the answer arrives as a stream of server-sent events
      description: |
        Needs the access token (see `/agent/status`). The server keeps the conversation: the app names
        it with a `conversation_id` of its own choosing (a ULID) and sends only the new question as
        `message`; the earlier ones are read from the database, as plain text (the assistant looks things
        up again with its own tools when it needs them). The history given to the model alternates
        `user` / `assistant`: answers that came out empty are left out, neighbours with the same role are
        joined, and the oldest messages are dropped beyond 30 messages or 24000 characters. The new
        question and the answer are kept even when the answer is stopped or fails.

        **Older form:** a request with `messages` (the whole history, ending with a `user` message) and no
        `message` is answered the way it always was and kept nowhere. It is deprecated and will be removed
        once every app sends `message`.

        One answer at a time per conversation: a second question while the first is still being answered
        gets `409`.

        Problems found before the answer starts are ordinary HTTP errors (below). Once the response
        is `200`, the body is `text/event-stream`; later failures arrive as an `error` event. Lines
        starting with `:` are keep-alive pings (every 15 s) and are to be ignored, as are events
        whose name the client does not know. Closing the connection stops the model.

        Events, in order of arrival (the `data:` line of each is JSON):

        - `start` — `{conversation_id}`, once, first.
        - `delta` — `{text}`, a piece of the answer. Markdown, in which `lesson:<id>` and
          `question:<id>` links point at lesson sections and questions, and a complete
          ```` ```svg ```` block is a diagram.
        - `tool` — `{id, name, label, status}`; `label` is a ready-to-show line ("在讲义里查找…"),
          `status` is `running`, then `done` or `error`.
        - `drafts` — `{drafts: [AgentDraft]}`, question-writing mode only: new draft questions for the
          learner to accept or discard.
        - `done` — `{stop, usage: {input, output, cached}}`, once, last. `stop` is `end_turn`,
          `max_rounds` (it looked things up too long) or `max_tokens` (the answer was cut off).
        - `error` — `{code, message}`; `code` is `budget_exceeded`, `unavailable`, `refused`,
          `timeout` or `internal`. Ends the stream instead of `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentChatRequest" }
      responses:
        "200":
          description: the answer, as server-sent events
          content:
            text/event-stream:
              schema: { type: string }
        "400": { description: "invalid request (no `conversation_id`, empty `message.text`, a `mode` different from the conversation's, an invalid history in the older form, unknown bank / lesson / question in `context`)" }
        "401": { description: missing or wrong access token }
        "404": { description: the assistant is not configured }
        "409": { description: the conversation is still answering an earlier question }
        "429": { description: this device already has the maximum number of conversations running (2) }
  /api/v1/agent/conversations:
    get:
      summary: The history of conversations with the assistant, newest first
      description: >
        Needs the access token. Every device that has the token sees every conversation. Conversations
        nobody has said anything in are not listed. Page with `before`, the `updated_at` of the last item
        of the previous page.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 100 } }
        - { name: before, in: query, schema: { type: integer }, description: "epoch ms; only conversations updated before this" }
        - { name: mode, in: query, schema: { type: string, enum: [learn, create] } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConversationPage" }
        "400": { description: unknown mode }
        "401": { description: missing or wrong access token }
  /api/v1/agent/conversations/{id}:
    get:
      summary: A whole conversation, to show it again and carry on in it
      description: >
        What the learner saw: the words, the lookup lines, the drafts (with what became of them) and a
        remark about how each answer ended. Needs the access token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConversation" }
        "401": { description: missing or wrong access token }
        "404": { description: unknown conversation }
    patch:
      summary: Rename a conversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, description: "cut to 30 characters, on one line" }
      responses:
        "204": { description: renamed }
        "400": { description: empty title }
        "401": { description: missing or wrong access token }
        "404": { description: unknown conversation }
    delete:
      summary: Delete a conversation
      description: >
        Deletes its messages, and discards the drafts nobody decided on (status `rejected`). Questions the
        learner already accepted are not touched. Needs the access token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: deleted }
        "401": { description: missing or wrong access token }
        "404": { description: unknown conversation }
        "409": { description: the conversation is still answering a question }
  /api/v1/agent/attachments:
    post:
      summary: Give the assistant a text file or a picture for a conversation
      description: >
        Needs the access token. The file is kept for the conversation `conversation_id`, which need not
        exist yet (it is created with the first message), and waits to be sent: list its id in the
        `attachment_ids` of a chat message. Two kinds are taken, told apart by the bytes and not by the
        name. Text files (`.md .markdown .txt .csv .json .log`): UTF-8, at most 512 KB and 120000
        characters; the assistant reads them a page at a time. Pictures (jpeg, png, gif, webp): at most
        5 MB and 8000 pixels on a side; the model is shown them with the message, so they are accepted
        only when `GET /agent/status` says `vision` (the assistant's model can look at pictures). The
        reason is in the error when a file is refused. A conversation holds at most 8 files, at most 4
        of them pictures, and a message carries at most 4. Files nobody sent are removed after a day.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [conversation_id, file]
              properties:
                conversation_id: { type: string, maxLength: 64 }
                file: { type: string, format: binary }
      responses:
        "201":
          description: kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAttachment" }
        "400": { description: "not accepted: wrong kind of file, not UTF-8, empty, too long or too big, a picture while the model cannot look at pictures, or the conversation is full" }
        "401": { description: missing or wrong access token }
        "413": { description: the upload is far too large }
  /api/v1/agent/attachments/{id}:
    get:
      summary: The file itself
      description: >
        Needs the access token. Text is returned as `text/plain; charset=utf-8` whatever the file was
        called; a picture is returned as it was uploaded, with its own type. Always with `nosniff` and a
        sandboxing CSP.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: the file
          content:
            text/plain: { schema: { type: string } }
            image/*: { schema: { type: string, format: binary } }
        "401": { description: missing or wrong access token }
        "404": { description: unknown file }
    delete:
      summary: Remove a file that has not been sent
      description: Needs the access token. A file a message carried goes only with its conversation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: removed }
        "400": { description: the file was already sent }
        "401": { description: missing or wrong access token }
        "404": { description: unknown file }
  /api/v1/agent/drafts:
    get:
      summary: The draft questions of a conversation that still wait for a decision
      description: >
        Lets an app that was closed show the cards again. Needs the access token. Drafts nobody decided
        on for 7 days are discarded.
      parameters:
        - { name: conversation_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts: { type: array, items: { $ref: "#/components/schemas/AgentDraft" } }
        "401": { description: missing or wrong access token }
  /api/v1/agent/drafts/{id}/accept:
    post:
      summary: Send a draft question to the review queue
      description: >
        Does not publish it: the question gets the status `needs_review` and appears in the admin
        review queue (source 助手); learners get it only after a reviewer approves it. Needs the
        access token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "the draft_id" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDraftResult" }
        "400": { description: already decided, or the lesson section it was written from has changed since }
        "401": { description: missing or wrong access token }
        "404": { description: unknown draft }
  /api/v1/agent/drafts/{id}/discard:
    post:
      summary: Throw a draft question away
      description: Needs the access token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "the draft_id" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDraftResult" }
        "400": { description: already decided }
        "401": { description: missing or wrong access token }
        "404": { description: unknown draft }
components:
  schemas:
    Bank:
      type: object
      required: [id, title, description, question_count]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        question_count: { type: integer }
    Question:
      type: object
      required: [id, bank_id, type, stem, options, answer, explanation, difficulty, tags, source_quote, sync_seq, updated_at]
      properties:
        id: { type: string }
        bank_id: { type: string }
        type: { type: string, enum: [single, judge] }
        stem: { type: string }
        options: { type: array, items: { type: string } }
        answer: { type: array, items: { type: integer }, description: "option indexes; one entry for single and judge" }
        explanation: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        source_quote: { type: string }
        document_id: { type: string, description: "the document (module / chapter) the question was generated from; empty if unknown. Older servers omit it" }
        document_title: { type: string, description: "title of that document" }
        document_created_at: { type: integer, description: "when that document was uploaded (ms); modules are listed in this order. 0 if unknown" }
        chunk_id: { type: string, description: "the section of that document the question was generated from: the id of a Lesson; empty if unknown. Older servers omit it" }
        sync_seq: { type: integer }
        updated_at: { type: integer }
    Lesson:
      type: object
      required: [id, bank_id, document_id, document_title, document_created_at, seq, heading_path, text]
      properties:
        id: { type: string, description: "the section's id; a Question's chunk_id" }
        bank_id: { type: string }
        document_id: { type: string, description: "the chapter: the document the section is in" }
        document_title: { type: string }
        document_created_at: { type: integer, description: "when the document was uploaded (ms); chapters are listed in this order" }
        seq: { type: integer, description: "position within the document" }
        heading_path: { type: string, description: "e.g. \"考点精讲 > 2.1 操作系统概述\"; the last part is the section's own title" }
        text: { type: string, description: "Markdown; pictures are `media:<id>` references like in questions" }
    LessonsPage:
      type: object
      required: [version, unchanged, items]
      properties:
        version: { type: integer, description: "changes whenever any section is added, edited, moved or removed; a positive integer below 2^48" }
        unchanged: { type: boolean, description: "true when the caller already has this version; items is then empty" }
        items: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
    QuestionsPage:
      type: object
      required: [items, deleted, next_seq, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Question" } }
        deleted: { type: array, items: { type: string } }
        next_seq: { type: integer }
        has_more: { type: boolean }
    State:
      type: object
      required: [question_id, favorite, wrong_count, updated_at]
      properties:
        question_id: { type: string }
        fsrs: { type: object, nullable: true, description: "opaque to the server" }
        due_at: { type: integer, nullable: true }
        favorite: { type: boolean }
        wrong_count: { type: integer }
        updated_at: { type: integer }
        sync_seq: { type: integer, readOnly: true }
    StatesPage:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/State" } }
        next_seq: { type: integer }
        has_more: { type: boolean }
    Attempt:
      type: object
      required: [id, question_id, device_id, answer, is_correct, answered_at]
      properties:
        id: { type: string, description: "client-generated ULID" }
        question_id: { type: string }
        device_id: { type: string }
        answer: { type: array, items: { type: integer } }
        is_correct: { type: boolean }
        duration_ms: { type: integer, nullable: true, description: "time from showing the question to answering it" }
        review_ms: { type: integer, nullable: true, description: "time spent on the question after answering (explanation, AI); re-uploading with a larger value raises it, a smaller one is ignored" }
        answered_at: { type: integer }
    AttemptsPage:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/Attempt" }
              - type: object
                properties:
                  sync_seq: { type: integer, readOnly: true }
        next_seq: { type: integer }
        has_more: { type: boolean }
    Exam:
      type: object
      required: [id, bank_id, finished_at, total, correct, answered, percent, passed, used_ms, items]
      description: |
        A finished mock exam. It never changes after it is handed in. `items` lists the
        paper in order so any device can review it.
      properties:
        id: { type: string, description: "client-generated ULID" }
        bank_id: { type: string }
        title: { type: string, maxLength: 200 }
        finished_at: { type: integer }
        total: { type: integer }
        correct: { type: integer }
        answered: { type: integer, description: "questions that got an answer; the rest were left blank" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        limit_sec: { type: integer, nullable: true, description: "time allowed; null when untimed" }
        used_ms: { type: integer }
        device_id: { type: string, maxLength: 64 }
        sync_seq: { type: integer, readOnly: true }
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [q, s, c]
            properties:
              q: { type: string, description: "question id" }
              s: { type: array, items: { type: integer }, description: "option indexes picked; empty = left blank" }
              c: { type: boolean, description: "answered correctly" }
    ExamsPage:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Exam" } }
        next_seq: { type: integer }
        has_more: { type: boolean }
    SessionProgress:
      type: object
      required: [scope, updated_at]
      description: |
        The quiz one device left part-way in one scope (a bank id), so another device can
        continue it. There is at most one per scope. A finished quiz is uploaded with
        `data: null`; that tombstone clears the saved quiz on every device.
      properties:
        scope: { type: string, maxLength: 64, description: "bank id" }
        data: { allOf: [{ $ref: "#/components/schemas/SessionData" }], nullable: true }
        updated_at: { type: integer, description: "client clock, ms; the newer one wins" }
        device_id: { type: string, maxLength: 64 }
        sync_seq: { type: integer, readOnly: true }
    SessionData:
      type: object
      description: |
        Opaque to the server (at most 512 KiB); every client reads and writes this shape.
        Questions and answers are kept by id, so questions withdrawn since are simply skipped.
      required: [title, ids, seed, index, answers]
      properties:
        title: { type: string }
        ids: { type: array, items: { type: string }, description: "question ids in the order they are practised" }
        seed: { type: integer, description: "seeds the option shuffle so a resumed quiz shows the same layout" }
        index: { type: integer, description: "position in ids of the current question" }
        answers:
          type: object
          description: "by question id: s = chosen option indexes (original order), c = whether it was right"
          additionalProperties:
            type: object
            required: [s, c]
            properties:
              s: { type: array, items: { type: integer } }
              c: { type: boolean }
    SessionsPage:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SessionProgress" } }
        next_seq: { type: integer }
        has_more: { type: boolean }
    AiConfig:
      type: object
      required: [base_url, api_key, model, max_tokens, temperature]
      properties:
        base_url: { type: string, description: "including the version segment; the app appends /chat/completions" }
        api_key: { type: string }
        model: { type: string }
        max_tokens: { type: integer }
        temperature: { type: number }
    AiNote:
      type: object
      required: [question_id, content, updated_at]
      properties:
        question_id: { type: string }
        content: { type: string, description: "Markdown, at most 64 KB" }
        model: { type: string }
        prompt_version: { type: string }
        selected: { type: array, items: { type: integer }, description: "option indexes the learner had picked when asking" }
        updated_at: { type: integer, description: "client clock, ms; last writer wins" }
        device_id: { type: string }
        sync_seq: { type: integer, description: "server-assigned; present on download" }
    NotesPage:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AiNote" } }
        next_seq: { type: integer }
        has_more: { type: boolean }
    AiUsage:
      type: object
      required: [id, model, created_at]
      properties:
        id: { type: string, maxLength: 64, description: "chosen by the app (ULID); makes a resend harmless" }
        question_id: { type: string, description: "the question that was explained, if any" }
        device_id: { type: string }
        model: { type: string }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cached_tokens: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        ok: { type: boolean }
        error: { type: string, description: "why a failed call failed; cut at 500 characters" }
        estimated:
          type: boolean
          description: the endpoint reported no token counts, so the app guessed them
        created_at: { type: integer, description: "when the call started, epoch ms" }
    UploadResult:
      type: object
      properties:
        accepted: { type: integer }
        ignored: { type: integer }
    AgentStatus:
      type: object
      required: [available, model, verified, vision]
      properties:
        available: { type: boolean }
        model: { type: string, description: "the model that answers" }
        vision: { type: boolean, description: "the model can look at pictures, so pictures may be attached to a message" }
        verified:
          type: boolean
          description: a second model (the validator role) double-checks the questions the assistant writes
    AgentMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    AgentChatRequest:
      type: object
      properties:
        conversation_id:
          type: string
          maxLength: 64
          description: >
            chosen by the app (a ULID). Names the conversation in the history, in the admin usage log and
            for its drafts. Required with `message`; with the older `messages` the server makes one up when
            it is empty.
        mode:
          type: string
          enum: [learn, create]
          default: learn
          description: "learn: answer questions about the lessons and the learner's weak points. create: write questions from a lesson section, as drafts. Fixed when the conversation begins; the conversation's own is used when this is empty."
        device_id: { type: string, maxLength: 64, description: "limits a device to two conversations at a time" }
        message:
          type: object
          description: The new question of a conversation kept on the server.
          required: [text]
          properties:
            text: { type: string }
            attachment_ids:
              type: array
              maxItems: 4
              items: { type: string }
              description: "ids from `POST /agent/attachments` for this conversation, not sent before"
        messages:
          type: array
          deprecated: true
          minItems: 1
          maxItems: 30
          description: The older form, used only when `message` is absent. Nothing is kept.
          items: { $ref: "#/components/schemas/AgentMessage" }
        context:
          type: object
          description: What the learner is looking at; the server puts it into the assistant's instructions. All parts are optional. A conversation keeps what it began with for the history list.
          properties:
            bank_id: { type: string }
            lesson_id: { type: string }
            question:
              type: object
              required: [id]
              properties:
                id: { type: string }
                selected: { type: array, items: { type: integer }, description: "the option indexes (of the question itself, not as shuffled on screen) the learner picked" }
    AgentConversationItem:
      type: object
      required: [id, mode, title, bank_id, lesson_id, question_id, message_count, pending_drafts, updated_at]
      properties:
        id: { type: string }
        mode: { type: string, enum: [learn, create] }
        title: { type: string, description: "the first 30 characters of the first question" }
        bank_id: { type: string, description: "what the learner was looking at when it began; empty if nothing" }
        lesson_id: { type: string }
        question_id: { type: string }
        message_count: { type: integer }
        pending_drafts: { type: integer, description: "drafts nobody has decided on yet" }
        updated_at: { type: integer, description: "epoch ms of the last message" }
    AgentConversationPage:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentConversationItem" } }
        has_more: { type: boolean }
    AgentDraftState:
      allOf:
        - $ref: "#/components/schemas/AgentDraft"
        - type: object
          required: [phase]
          properties:
            phase:
              type: string
              enum: [pending, accepted, discarded]
              description: "pending: still waiting. accepted: sent to review (maybe published). discarded: thrown away, replaced, or left too long."
    AgentAttachment:
      type: object
      required: [id, kind, name, mime, size]
      properties:
        id: { type: string }
        kind: { type: string, enum: [text, image] }
        name: { type: string, description: "the file's own name, for display" }
        mime: { type: string }
        size: { type: integer, description: bytes as uploaded }
        chars: { type: integer, description: "text files: characters of the text" }
        width: { type: integer, description: "pictures: pixels; absent when the size could not be read (webp)" }
        height: { type: integer }
    AgentStoredMessage:
      type: object
      required: [id, role, text, tools, drafts, attachments, note, error, created_at]
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
        tools:
          type: array
          description: the lookup lines shown above an answer
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              status: { type: string, enum: [running, done, error] }
        drafts: { type: array, items: { $ref: "#/components/schemas/AgentDraftState" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/AgentAttachment" }, description: "files the message carried" }
        note: { type: string, description: "how the answer ended, if not simply: stopped, cut short" }
        error: { type: string }
        created_at: { type: integer }
    AgentConversation:
      allOf:
        - $ref: "#/components/schemas/AgentConversationItem"
        - type: object
          required: [messages]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/AgentStoredMessage" } }
    AgentDraft:
      type: object
      required: [draft_id, lesson_id, type, stem, options, answer_index, explanation, difficulty, tags, source_quote, verified]
      properties:
        draft_id: { type: string }
        lesson_id: { type: string, description: "the section the question was written from" }
        type: { type: string, enum: [single, judge] }
        stem: { type: string }
        options: { type: array, items: { type: string } }
        answer_index: { type: integer }
        explanation: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        source_quote: { type: string, description: "the sentence of the section the question rests on" }
        verified: { type: boolean, description: "a second model answered it independently and agreed" }
    AgentDraftResult:
      type: object
      properties:
        id: { type: string }
        status: { type: string, description: "needs_review after accept, rejected after discard" }
